<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>تواصل مع الإدارة | جوان</title>  <link rel="icon" href="../assets/branding/logo-external.png">
</head>
<body>
<div class="page wrap">
<div class="card form" style="max-width:820px">
<h2 id="pageTitle">تواصل مع الإدارة</h2>
<p class="muted" id="pageSubtitle">يمكنك إرسال رسالة من داخل المنصة أو عبر واتساب.</p>
<div class="grid-2">
  <a class="btn btn-success" data-whatsapp="contact" href="#" style="width:100%;font-size:16px">
    تواصل مع الإدارة عبر واتساب
  </a>
  <div></div>
</div>

<form id="msgForm" style="margin-top:18px">
  <div class="form-group"><label>الرسالة</label><textarea name="message" rows="4" placeholder="اكتب مشكلتك أو استفسارك" required></textarea></div>
  <button class="btn btn-primary" type="submit">إرسال</button>
</form>

<div id="threadList" class="empty" style="margin-top:22px">جارٍ التحميل...</div>
</div>
</div>
<script type="module" src="../js/app.js"></script>
<script type="module">
import { guardPage } from "../js/auth.js";
import { sendSupportMessage, listenMySupportMessages, listenAllSupportMessages, replySupportMessage } from "../js/support.js";
import { escapeHtml, formatDate, statusBadgeClass, showToast } from "../js/common.js";

const { user, data } = await guardPage(["customer", "driver", "admin", "super_admin"]);
const isAdmin = data.role === "admin" || data.role === "super_admin";

if (isAdmin) {
  document.getElementById("pageTitle").textContent = "صندوق الدعم";
  document.getElementById("pageSubtitle").textContent = "كل الرسائل الواردة من العملاء والسائقين.";
  document.getElementById("msgForm").style.display = "none";
} else {
  document.getElementById("msgForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector("button");
    btn.disabled = true;
    try {
      await sendSupportMessage(user.uid, data.role, form.message.value);
      form.reset();
      showToast("تم إرسال رسالتك.");
    } catch (err) {
      showToast(err?.message || "تعذر الإرسال.");
    } finally {
      btn.disabled = false;
    }
  });
}

function renderThread(messages) {
  const list = document.getElementById("threadList");
  if (!messages.length) { list.className = "empty"; list.textContent = "لا توجد رسائل بعد."; return; }
  list.className = "";
  list.innerHTML = messages.map(m => `
    <div class="order-row" data-id="${m.id}" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;justify-content:space-between">
        <div><strong>${escapeHtml(m.message)}</strong><div class="muted" style="font-size:12px">${formatDate(m.createdAt)}${isAdmin ? " · " + escapeHtml(m.role) : ""}</div></div>
        <span class="${statusBadgeClass(m.status)}">${m.status === "answered" ? "تم الرد" : "بانتظار الرد"}</span>
      </div>
      ${m.reply ? `<div class="alert alert-success" style="margin:0">${escapeHtml(m.reply)}</div>` : ""}
      ${isAdmin && !m.reply ? `
        <form class="reply-form" style="display:flex;gap:8px">
          <input name="reply" placeholder="اكتب الرد..." style="flex:1;padding:10px;border:1px solid #d9d9d9;border-radius:10px" required>
          <button class="btn btn-primary btn-sm" type="submit">رد</button>
        </form>` : ""}
    </div>`).join("");

  if (isAdmin) {
    list.querySelectorAll(".reply-form").forEach(form => {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = form.closest(".order-row").dataset.id;
        const btn = form.querySelector("button");
        btn.disabled = true;
        try {
          await replySupportMessage(id, user.uid, form.reply.value);
        } catch (err) {
          showToast(err?.message || "تعذر إرسال الرد.");
          btn.disabled = false;
        }
      });
    });
  }
}

if (isAdmin) {
  listenAllSupportMessages(renderThread);
} else {
  listenMySupportMessages(user.uid, renderThread);
}
</script>
<script type="module">
try {
  const { firebaseConfig } = await import("../js/firebase-config.js");
  if (firebaseConfig) window.__JW_FBASE_CONFIG__ = firebaseConfig;
} catch (e) {
  console.warn("Jawan Firebase config bridge:", e);
}
</script>
<script type="module" src="../js/jawan-ai.js"></script>
</body></html>
