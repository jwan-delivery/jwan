<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>تغيير كلمة المرور | جوان</title>  <link rel="icon" href="../assets/branding/logo-external.png">
</head><body class="auth-shell"><main class="auth"><div class="brand-center"><div class="brand-mark"><img src="/assets/branding/logo-external.png" alt="جوان"></div><h2>تغيير كلمة المرور</h2><p class="muted">أمان حسابك أولًا.</p></div><div class="card"><form id="form"><div class="form-group"><label>كلمة المرور الجديدة</label><input name="password" type="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%">تغيير كلمة المرور</button></form><p id="msg" class="muted" style="margin-top:14px"></p><a class="auth-back" href="driver.html" aria-label="العودة"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a></div></main><script type="module">import { guardPage } from "../js/auth.js"; import { auth } from "../js/firebase-config.js"; import { updatePassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js"; import { showToast } from "../js/common.js"; await guardPage(["driver","customer"]);document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();try{await updatePassword(auth.currentUser,e.target.password.value);showToast("تم تغيير كلمة المرور بنجاح.");e.target.reset();}catch(err){if(err?.code==="auth/requires-recent-login")showToast("لأمانك، سجّل الدخول من جديد ثم غيّر كلمة المرور.");else showToast("تعذر تغيير كلمة المرور الآن.");}});</script><script src="../js/driver-menu.js"></script>
<script type="module">
try {
  const { firebaseConfig } = await import("../js/firebase-config.js");
  if (firebaseConfig) window.__JW_FBASE_CONFIG__ = firebaseConfig;
} catch (e) {
  console.warn("Jawan Firebase config bridge:", e);
}
</script>
<script type="module" src="../js/jawan-ai.js"></script>
</body></html>
