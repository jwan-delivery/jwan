<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>لوحة العميل | جوان</title>  <link rel="icon" href="../assets/branding/logo-external.png">
</head>
<body>
<button type="button" data-logout style="padding:9px 15px;border:0;border-radius:10px;cursor:pointer;font-weight:700;">تسجيل الخروج</button>
<header class="mobilebar"><strong>جوان</strong><a href="../index.html">الرئيسية</a></header>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand" style="margin-bottom:20px"><div class="brand-mark"><img src="/assets/branding/logo-external.png" alt="جوان للتوصيل"></div><div><div class="brand-name" style="color:#fff">جوان</div><small id="userName">العميل</small></div></div>
    <a class="active" href="customer.html">لوحتي</a><a href="create-order.html">طلب توصيل</a><a href="support.html">تواصل مع الإدارة</a>
  <a href="privacy.html">الخصوصية</a><a href="terms.html">الشروط</a>
    <a href="#" id="logoutLink">تسجيل الخروج</a>
  </aside>
  <main class="content">
    <h1 class="page-title">مرحبًا بك</h1><p class="muted">تابع طلباتك والتفاوض على السعر من مكان واحد.</p>
    <div id="pendingBanner" class="alert alert-danger" style="display:none">حسابك بانتظار مراجعة الإدارة، سيمكنك إنشاء طلبات بعد التفعيل.</div>
    <div class="grid-3" style="margin:20px 0">
      <div class="card kpi"><small>الطلبات</small><strong id="kpiTotal">0</strong></div>
      <div class="card kpi"><small>المكتملة</small><strong id="kpiCompleted">0</strong></div>
      <div class="card kpi"><small>الحالية</small><strong id="kpiActive">0</strong></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3>طلباتي الأخيرة</h3><a class="btn btn-primary" href="create-order.html">+ طلب جديد</a></div>
      <div id="ordersList" class="empty">جارٍ التحميل...</div>
    </div>
  </main>
</div>

<script type="module" src="../js/app.js"></script>
<script type="module">
import { guardPage, logoutUser, setupLogoutButtons, VEHICLE_TYPES } from "../js/auth.js";
import { listenMyOrders, customerConfirmDelivery, customerReportNotDelivered, customerCancelOrder } from "../js/orders.js";
import { fetchRatedOrderIds, submitRating } from "../js/ratings.js";
import { listenNegotiation, listenOrderContacts, proposePrice, respondToOffer } from "../js/negotiation.js";
import { linkGoogleAccount } from "../js/auth.js";
import { escapeHtml, formatMoney, formatDate, statusLabel, statusBadgeClass, showToast } from "../js/common.js";

setupLogoutButtons();

const { user, data } = await guardPage(["customer"]);

const googleLinkButton = document.getElementById("googleLinkBtn");
if (googleLinkButton) {
  if ((user.providerData || []).some((p) => p.providerId === "google.com")) {
    googleLinkButton.textContent = "Google مرتبط بالحساب";
    googleLinkButton.disabled = true;
  } else {
    googleLinkButton.addEventListener("click", async () => {
      googleLinkButton.disabled = true;
      try {
        await linkGoogleAccount();
        showToast("تم ربط حساب Google بنجاح.");
        googleLinkButton.textContent = "Google مرتبط بالحساب";
      } catch (err) {
        showToast(err?.code === "auth/credential-already-in-use" ? "حساب Google مرتبط بحساب آخر." : (err?.message || "تعذر ربط Google."));
        googleLinkButton.disabled = false;
      }
    });
  }
}

document.getElementById("userName").textContent = data.name || "العميل";
if (data.status === "pending") document.getElementById("pendingBanner").style.display = "block";

document.getElementById("logoutLink").addEventListener("click", async (e) => {
  e.preventDefault(); await logoutUser(); location.href = "login.html";
});

let ratedOrderIds = await fetchRatedOrderIds(user.uid).catch(() => new Set());
const negotiationUnsubs = new Map();
const currentOrders = new Map();

listenMyOrders("customer", user.uid, (orders) => {
  orders.forEach(o => currentOrders.set(o.id, o));
  document.getElementById("kpiTotal").textContent = orders.length;
  document.getElementById("kpiCompleted").textContent = orders.filter(o => o.status === "completed").length;
  document.getElementById("kpiActive").textContent = orders.filter(o => !["completed","cancelled","rejected"].includes(o.status)).length;

  const list = document.getElementById("ordersList");
  if (!orders.length) { list.className="empty"; list.textContent="لا توجد طلبات بعد."; return; }

  list.className="";
  list.innerHTML = orders.slice(0,20).map(renderOrder).join("");

  for (const order of orders) {
    if (order.status !== "accepted") continue;
    if (negotiationUnsubs.has(order.id)) continue;
    negotiationUnsubs.set(order.id, listenNegotiation(order.id, (state) => updateNegotiationUI(order.id, state)));
    listenOrderContacts(order.id, (contacts) => renderContacts(order.id, contacts));
  }

  bindDeliveryButtons(list, orders);

function bindCustomerCancelButtons(list, orders) {
  list.querySelectorAll(".customer-cancel-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const order = orders.find((o) => o.id === id);
      if (!order) return;

      if (
        order.status !== "pending" ||
        order.driverId != null ||
        (order.negotiationStatus && order.negotiationStatus !== "none")
      ) {
        showToast("لا يمكن إلغاء الطلب بعد بدء التفاوض أو تعيين سائق.");
        return;
      }

      const reason = prompt(
        "سبب إلغاء الطلب؟\n\nاكتب السبب، مثل: وجدت سائقًا آخر، تغيّر موقفي، تأخر العثور على سائق."
      );

      if (reason === null) return;

      const cleanReason = reason.trim();
      if (!cleanReason) {
        showToast("اكتب سبب الإلغاء أولًا.");
        return;
      }

      if (!confirm("هل أنت متأكد من إلغاء الطلب؟")) return;

      btn.disabled = true;

      try {
        await customerCancelOrder(id, user.uid, cleanReason);
        showToast("تم إلغاء الطلب.");
      } catch (e) {
        btn.disabled = false;
        showToast(e?.message || "تعذر إلغاء الطلب.");
      }
    });
  });
}


  bindCustomerCancelButtons(list, orders);
});

function renderOrder(o) {
  const fee = Number(o.agreedFee || o.deliveryFee || 0);
  const feeText = fee > 0 ? formatMoney(fee) : "لم يتم الاتفاق على السعر";
  const canConfirm = o.status === "awaiting_confirmation" && !o.customerConfirmedAt;
  const canReport =
    o.status === "awaiting_confirmation" &&
    !o.customerConfirmedAt &&
    o.createdAt?.toDate &&
    Date.now() - o.createdAt.toDate().getTime() >= 60*60*1000;
  const canRate = o.status === "completed" && !ratedOrderIds.has(o.id);

  return `<div class="order-row" data-id="${o.id}">
    <div style="flex:1">
      <strong>${escapeHtml(VEHICLE_TYPES[o.vehicleType] || o.vehicleType || o.type || "طلب")}</strong>
      <div class="muted">${escapeHtml(o.origin || "")} ← ${escapeHtml(o.destination || "")}</div>
      <div class="muted" style="font-size:12px">${escapeHtml(orderDetails(o))} · ${formatDate(o.createdAt)}</div>
      ${["accepted"].includes(o.status) ? `<div id="neg-${o.id}" class="negotiation-summary" style="margin-top:12px"></div><div id="contacts-${o.id}" style="margin-top:10px"></div>` : ""}
    </div>
    <div style="text-align:left;min-width:165px">
      <div>${feeText}</div>
      <span class="${statusBadgeClass(o.status)}">${statusLabel(o.status)}</span>
      ${canConfirm ? `<button class="btn btn-primary btn-sm confirm-btn">تأكيد الاستلام</button>` : ""}
      ${canReport ? `<button class="btn btn-dark btn-sm report-btn">لم تصل</button>` : ""}
      ${canRate ? `<button class="btn btn-dark btn-sm rate-btn">تقييم</button>` : ""}
    </div>
  </div>`;
}

function updateNegotiationUI(orderId, state) {
  const box = document.getElementById(`neg-${orderId}`);
  if (!box) return;
  const n = state.negotiation;
  if (!n) {
    box.innerHTML = `<a class="btn btn-primary btn-sm" href="negotiation.html?order=${encodeURIComponent(orderId)}">فتح صفحة التفاوض</a><button type="button" class="btn btn-dark btn-sm customer-cancel-btn" data-id="${o.id}">إلغاء الطلب</button>`;
    return;
  }
  const status = n.status === "agreed" ? `تم الاتفاق على ${formatMoney(n.currentOffer)}` : (n.currentOffer == null ? "في انتظار العرض الأول" : `العرض الحالي ${formatMoney(n.currentOffer)}`);
  box.innerHTML = `<div class="glass-wide" style="padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><strong>${status}</strong><a class="btn btn-primary btn-sm" href="negotiation.html?order=${encodeURIComponent(orderId)}">فتح التفاوض</a></div>`;
}

function renderContacts(orderId, contacts) {
  const el = document.getElementById(`contacts-${orderId}`);
  if (!el || !contacts) return;
  el.innerHTML = `<div class="alert alert-success">أرقام التواصل: السائق ${escapeHtml(contacts.driverPhone || "—")} | أنت ${escapeHtml(contacts.customerPhone || data.phone || "—")}</div>`;
}

function bindDeliveryButtons(list, orders) {
  list.querySelectorAll(".confirm-btn").forEach(btn => btn.addEventListener("click", () =>
    runAction(btn, () => customerConfirmDelivery(btn.closest(".order-row").dataset.id))
  ));
  list.querySelectorAll(".report-btn").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.closest(".order-row").dataset.id;
    const reason = prompt("أدخل سبب الإبلاغ عن عدم وصول الطلب:");
    if (!reason) return;
    runAction(btn, () => customerReportNotDelivered(id, user.uid));
  }));
  list.querySelectorAll(".rate-btn").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.closest(".order-row").dataset.id;
    const order = orders.find(o => o.id === id);
    const stars = prompt("قيّم الخدمة من 1 إلى 5:", "5");
    if (!stars) return;
    const comment = prompt("تعليق (اختياري):", "") || "";
    try {
      await submitRating(id, user.uid, order.driverId, stars, comment);
      ratedOrderIds.add(id); showToast("شكرًا لتقييمك!"); btn.remove();
    } catch (err) { showToast(err?.message || "تعذر إرسال التقييم."); }
  }));
}

async function runAction(btn, action) {
  btn.disabled = true;
  try { await action(); showToast("تمت العملية."); }
  catch (err) { showToast(err?.message || "حدث خطأ، حاول مرة أخرى."); btn.disabled = false; }
}

function orderDetails(o) {
  if (o.serviceCategory === "passenger") {
    return `ركاب: ${o.passengerCount}${o.hasLuggage ? `، أمتعة: ${o.luggageDescription || "نعم"}` : "، بدون أمتعة"}`;
  }
  return `بضاعة: ${o.cargoType || ""} — ${o.cargoDescription || ""}`;
}
</script>
<script type="module">
try {
  const { firebaseConfig } = await import("../js/firebase-config.js");
  if (firebaseConfig) window.__JW_FBASE_CONFIG__ = firebaseConfig;
} catch (e) {
  console.warn("Jawan Firebase config bridge:", e);
}
</script>
<script type="module" src="../js/jawan-ai.js"></script>
</body>
</html>
