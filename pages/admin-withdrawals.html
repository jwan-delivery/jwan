<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>السحوبات | إدارة جوان</title>  <link rel="icon" href="../assets/branding/logo-external.png">
</head>
<body>
<header class="mobilebar"><strong>جوان — الإدارة</strong><a href="../index.html">الرئيسية</a></header>
<div class="app-shell">
<aside class="sidebar">
 <div class="brand" style="margin-bottom:20px"><div class="brand-mark"><img src="/assets/branding/logo-external.png" alt="جوان للتوصيل"></div><div><div class="brand-name" style="color:#fff">جوان</div><small>الإدارة</small></div></div>
 <a href="admin.html">الرئيسية</a><a href="admin-orders.html">الطلبات</a><a href="admin-users.html">المستخدمون</a><a href="admin-topups.html">شحن المحافظ</a><a class="active" href="admin-withdrawals.html">السحوبات</a><a href="admin-analytics.html">التحليلات</a><a id="managersLink" href="admin-managers.html" style="display:none">المدراء</a><a href="support.html">الدعم</a>
 <a href="#" id="logoutLink">تسجيل الخروج</a>
</aside>
<main class="content">
<h1 class="page-title">طلبات سحب الرصيد</h1>
<p class="muted">بعد التحويل الفعلي للسائق، ضع الطلب كـ "مدفوع".</p>
<div class="card"><div id="list" class="empty">جارٍ التحميل...</div></div>
</main></div>
<script type="module" src="../js/app.js"></script>
<script type="module">
import { guardPage, logoutUser } from "../js/auth.js";
import { listenAllWithdrawalRequests, reviewWithdrawalRequest, listenUsersByRole } from "../js/admin.js";
import { escapeHtml, formatMoney, formatDate, statusBadgeClass, showToast } from "../js/common.js";

const { user, data } = await guardPage(["admin", "super_admin"]);
const admin = { uid: user.uid, role: data.role };
if (data.role === "super_admin") document.getElementById("managersLink").style.display = "block";
document.getElementById("logoutLink").addEventListener("click", async (e) => { e.preventDefault(); await logoutUser(); location.href = "login.html"; });

let drivers = [];
listenUsersByRole("driver", (list) => { drivers = list; });

const STATUS_LABELS = { pending: "بانتظار المراجعة", approved: "تمت الموافقة", paid: "تم الدفع", rejected: "مرفوض" };

listenAllWithdrawalRequests((requests) => {
  const list = document.getElementById("list");
  if (!requests.length) { list.className = "empty"; list.textContent = "لا توجد طلبات سحب."; return; }

  list.className = "";
  list.innerHTML = requests.map(r => {
    const driver = drivers.find(d => d.id === r.driverId);
    return `
    <div class="order-row" data-id="${r.id}">
      <div>
        <strong>${escapeHtml(driver?.name || r.driverId)}</strong> — ${escapeHtml(driver?.phone || "")}
        <div class="muted" style="font-size:13px">${escapeHtml(r.paymentMethod)} — ${escapeHtml(r.accountReference)}</div>
        <div class="muted" style="font-size:12px">${formatDate(r.createdAt)}</div>
      </div>
      <div style="text-align:left">
        <div><strong>${formatMoney(r.amount)}</strong></div>
        <span class="${statusBadgeClass(r.status)}">${STATUS_LABELS[r.status] || r.status}</span><br>
        ${r.status === "pending" ? `<button class="btn btn-primary btn-sm paid-btn">وضع كمدفوع</button><button class="btn btn-dark btn-sm reject-btn">رفض</button>` : ""}
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll(".paid-btn").forEach(btn => btn.addEventListener("click", () => act(btn, "paid")));
  list.querySelectorAll(".reject-btn").forEach(btn => btn.addEventListener("click", () => act(btn, "rejected")));

  async function act(btn, status) {
    const id = btn.closest(".order-row").dataset.id;
    btn.closest(".order-row").querySelectorAll("button").forEach(b => b.disabled = true);
    try { await reviewWithdrawalRequest(admin, id, status); }
    catch (err) { showToast(err?.message || "حدث خطأ."); }
  }
});
</script>
<script type="module">
try {
  const { firebaseConfig } = await import("../js/firebase-config.js");
  if (firebaseConfig) window.__JW_FBASE_CONFIG__ = firebaseConfig;
} catch (e) {
  console.warn("Jawan Firebase config bridge:", e);
}
</script>
<script type="module" src="../js/jawan-ai.js"></script>
</body></html>
