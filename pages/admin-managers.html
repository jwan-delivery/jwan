<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>المدراء | إدارة جوان</title>  <link rel="icon" href="../assets/branding/logo-external.png">
</head>
<body>
<header class="mobilebar"><strong>جوان — الإدارة</strong><a href="../index.html">الرئيسية</a></header>
<div class="app-shell">
<aside class="sidebar">
 <div class="brand" style="margin-bottom:20px"><div class="brand-mark"><img src="/assets/branding/logo-external.png" alt="جوان للتوصيل"></div><div><div class="brand-name" style="color:#fff">جوان</div><small>الإدارة العليا</small></div></div>
 <a href="admin.html">الرئيسية</a><a href="admin-orders.html">الطلبات</a><a href="admin-users.html">المستخدمون</a><a href="admin-topups.html">شحن المحافظ</a><a href="admin-withdrawals.html">السحوبات</a><a href="admin-analytics.html">التحليلات</a><a class="active" href="admin-managers.html">المدراء</a><a href="support.html">الدعم</a>
 <a href="#" id="logoutLink">تسجيل الخروج</a>
</aside>
<main class="content">
<h1 class="page-title">إدارة المدراء</h1>
<p class="muted">هذه الصفحة مخصصة للإدارة العليا فقط.</p>

<div class="card" style="max-width:480px;margin-bottom:20px">
  <h3>إضافة مدير جديد</h3>
  <form id="addForm">
    <div class="form-group"><label>الاسم</label><input name="name" required></div>
    <div class="form-group"><label>رقم الهاتف</label><input data-phone name="phone" maxlength="10" required></div>
    <div class="form-group"><label>كلمة المرور</label><input name="password" type="password" minlength="6" required></div>
    <button class="btn btn-primary" style="width:100%">إضافة مدير</button>
  </form>
</div>

<div class="card"><h3>المدراء الحاليون</h3><div id="list" class="empty">جارٍ التحميل...</div></div>
</main></div>
<script type="module" src="../js/app.js"></script>
<script type="module">
import { guardPage, logoutUser } from "../js/auth.js";
import { listenManagers, createManager, setManagerRole, suspendManager, approveUser } from "../js/admin.js";
import { escapeHtml, accountStatusLabel, statusBadgeClass, showToast } from "../js/common.js";

const { user, data } = await guardPage(["admin", "super_admin"]);
if (data.role !== "super_admin") { location.href = "admin.html"; }
const admin = { uid: user.uid, role: data.role };

document.getElementById("logoutLink").addEventListener("click", async (e) => { e.preventDefault(); await logoutUser(); location.href = "login.html"; });

document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector("button");
  btn.disabled = true;
  try {
    await createManager(admin, form.name.value.trim(), form.phone.value, form.password.value);
    showToast("تمت إضافة المدير.");
    form.reset();
  } catch (err) {
    showToast(err?.message || "تعذرت الإضافة.");
  } finally {
    btn.disabled = false;
  }
});

listenManagers((managers) => {
  const list = document.getElementById("list");
  list.className = "";
  list.innerHTML = managers.map(m => `
    <div class="order-row" data-id="${m.id}">
      <div><strong>${escapeHtml(m.name)}</strong> — ${escapeHtml(m.phone)}
        <div class="muted" style="font-size:13px">${m.role === "super_admin" ? "إدارة عليا" : "مدير"}</div>
      </div>
      <div style="text-align:left">
        <span class="${statusBadgeClass(m.status)}">${accountStatusLabel(m.status)}</span><br>
        ${m.id === user.uid ? `<span class="muted" style="font-size:12px">هذا حسابك</span>` : `
          ${m.status !== "active" ? `<button class="btn btn-primary btn-sm activate-btn">تفعيل</button>` : `<button class="btn btn-dark btn-sm suspend-btn">إيقاف</button>`}
          <button class="btn btn-sm role-btn" style="background:#f2f2f2">${m.role === "super_admin" ? "تنزيل لمدير" : "ترقية لإدارة عليا"}</button>
        `}
      </div>
    </div>`).join("");

  list.querySelectorAll(".activate-btn").forEach(btn => btn.addEventListener("click", () => act(btn, m => approveUser(admin, m))));
  list.querySelectorAll(".suspend-btn").forEach(btn => btn.addEventListener("click", () => act(btn, m => suspendManager(admin, m))));
  list.querySelectorAll(".role-btn").forEach(btn => btn.addEventListener("click", (e) => {
    const id = btn.closest(".order-row").dataset.id;
    const m = managers.find(x => x.id === id);
    act(btn, () => setManagerRole(admin, m, m.role === "super_admin" ? "admin" : "super_admin"));
  }));

  async function act(btn, fn) {
    const id = btn.closest(".order-row").dataset.id;
    const m = managers.find(x => x.id === id);
    btn.disabled = true;
    try { await fn(m); } catch (err) { showToast(err?.message || "حدث خطأ."); btn.disabled = false; }
  }
});
</script>
<script type="module">
try {
  const { firebaseConfig } = await import("../js/firebase-config.js");
  if (firebaseConfig) window.__JW_FBASE_CONFIG__ = firebaseConfig;
} catch (e) {
  console.warn("Jawan Firebase config bridge:", e);
}
</script>
<script type="module" src="../js/jawan-ai.js"></script>
</body></html>
