<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>التفاوض | جوان</title>  <link rel="icon" href="../assets/branding/logo-external.png">
</head><body><main class="negotiation-hero"><section class="negotiation-panel glass-wide"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><span class="badge badge-info">مفاوضة الطلب</span><h1 id="title" class="page-title">جارٍ التحميل...</h1></div><a id="back" class="btn btn-dark" href="#">العودة</a></div><div id="details" class="muted" style="margin:12px 0 24px"></div><div id="status" class="muted" style="margin-bottom:8px"></div><div id="current" class="negotiation-current">—</div><div id="actions" style="margin-top:24px"></div><div id="contacts" style="margin-top:18px"></div><p class="muted" style="margin-top:22px">مدة التفاوض 30 دقيقة. بعد الاتفاق فقط تصبح أرقام التواصل متاحة.</p></section></main><script type="module">import { guardPage } from "../js/auth.js"; import { db } from "../js/firebase-config.js"; import { doc,getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"; import { listenNegotiation,listenOrderContacts,proposePrice,startNegotiation,respondToOffer } from "../js/negotiation.js"; import { escapeHtml,formatMoney,showToast } from "../js/common.js"; const id=new URLSearchParams(location.search).get("order"); const {user,data}=await guardPage(["driver","customer"]); if(!id){showToast("لم يتم تحديد الطلب.");location.href=data.role==="driver"?"driver.html":"customer.html";} else {const snap=await getDoc(doc(db,"orders",id)); if(!snap.exists()){showToast("الطلب غير موجود.");location.href=data.role==="driver"?"driver.html":"customer.html";} else {const o=snap.data();document.getElementById("back").href=data.role==="driver"?"driver.html":"customer.html";document.getElementById("title").textContent=`طلب ${o.origin||""} ← ${o.destination||""}`;document.getElementById("details").textContent=data.role==="driver"?(o.serviceCategory==="passenger"?`ركاب: ${o.passengerCount||"—"}`:`بضاعة: ${o.cargoType||"—"}`):"التفاوض على أجرة الطلب";listenNegotiation(id,state=>render(state));listenOrderContacts(id,c=>{if(c)document.getElementById("contacts").innerHTML=`<div class="alert alert-success">العميل: ${escapeHtml(c.customerPhone||"—")} — السائق: ${escapeHtml(c.driverPhone||"—")}</div>`});} } function render(state){const n=state.negotiation,cur=document.getElementById("current"),actions=document.getElementById("actions");if(!n){cur.textContent="لا توجد مفاوضة بعد.";if(data.role==="driver")actions.innerHTML=`<div class="form-group"><input id="amount" type="number" min="1" placeholder="السعر المقترح"><button id="send" class="btn btn-primary">إرسال العرض الأول</button></div>`;document.getElementById("send")?.addEventListener("click",()=>go(()=>startNegotiation({orderId:id,userId:user.uid,role:data.role,name:data.name,amount:document.getElementById("amount").value})));return;} if(n.status==="agreed"){cur.textContent=formatMoney(n.currentOffer);actions.innerHTML=`<div class="alert alert-success">تم الاتفاق. يمكنك الآن التواصل مع الطرف الآخر.</div>`;return;} cur.textContent=n.currentOffer==null?"بانتظار العرض الأول":formatMoney(n.currentOffer); actions.innerHTML=`<div class="negotiation-actions">${n.offeredBy!==user.uid&&n.currentOffer!=null?`<button id="accept" class="btn btn-primary">قبول العرض</button><button id="reject" class="btn btn-dark">رفض العرض</button>`:""}<input id="amount" class="form-group" type="number" min="1" placeholder="عرض جديد"><button id="counter" class="btn btn-primary">إرسال العرض</button></div>`;document.getElementById("accept")?.addEventListener("click",()=>go(()=>respondToOffer({orderId:id,userId:user.uid,role:data.role,name:data.name,action:"accept"})));document.getElementById("reject")?.addEventListener("click",()=>go(()=>respondToOffer({orderId:id,userId:user.uid,role:data.role,name:data.name,action:"reject"})));document.getElementById("counter")?.addEventListener("click",()=>go(()=>proposePrice({orderId:id,userId:user.uid,role:data.role,name:data.name,amount:document.getElementById("amount").value})));} async function go(fn){try{await fn();showToast("تم تحديث التفاوض.")}catch(e){showToast(e?.message||"تعذر تحديث التفاوض.")}}</script><script type="module">
try {
  const { firebaseConfig } = await import("../js/firebase-config.js");
  if (firebaseConfig) window.__JW_FBASE_CONFIG__ = firebaseConfig;
} catch (e) {
  console.warn("Jawan Firebase config bridge:", e);
}
</script>
<script type="module" src="../js/jawan-ai.js"></script>
</body></html>
