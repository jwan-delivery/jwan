name: Jawan Flutter Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - flutter-native-20260913

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          rm -rf .flutter_seed
          flutter create \
            --org sd.jawan \
            --project-name delivery \
            --platforms android \
            .flutter_seed

          rm -rf mobile-app/android
          cp -R .flutter_seed/android mobile-app/android
          rm -rf .flutter_seed

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build Release APK
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Build Release AAB
        working-directory: mobile-app
        run: flutter build appbundle --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jawan-flutter-release
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
