name: Build Jawan Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-native-20260913

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf .flutter_seed
          mkdir -p .flutter_seed

          flutter create \
            --org sd.jawan \
            --project-name delivery \
            --platforms android \
            .flutter_seed

          rm -rf mobile-app/android
          cp -R .flutter_seed/android mobile-app/android

          rm -rf .flutter_seed

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build debug APK
        working-directory: mobile-app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jawan-flutter-debug-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
