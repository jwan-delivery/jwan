name: Jawan Flutter Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - flutter-native-20260913

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tracked Android project
        working-directory: mobile-app
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          grep -q 'sd.jawan.delivery' android/app/src/main/AndroidManifest.xml
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          test -f android/app/build.gradle
          test -f lib/main_native.dart
          echo "Using the tracked Android project and main_native.dart. No Android regeneration will occur."

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build Release APK
        working-directory: mobile-app
        run: |
          flutter build apk --release \
            --target lib/main_native.dart \
            --dart-define=JAWAN_FIREBASE_API_KEY=${{ secrets.JAWAN_FIREBASE_API_KEY }} \
            --dart-define=JAWAN_FIREBASE_APP_ID=${{ secrets.JAWAN_FIREBASE_APP_ID }} \
            --dart-define=JAWAN_FIREBASE_PROJECT_ID=jwan-delivery-c930d-72911 \
            --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID=22978141935

      - name: Build Release AAB
        working-directory: mobile-app
        run: |
          flutter build appbundle --release \
            --target lib/main_native.dart \
            --dart-define=JAWAN_FIREBASE_API_KEY=${{ secrets.JAWAN_FIREBASE_API_KEY }} \
            --dart-define=JAWAN_FIREBASE_APP_ID=${{ secrets.JAWAN_FIREBASE_APP_ID }} \
            --dart-define=JAWAN_FIREBASE_PROJECT_ID=jwan-delivery-c930d-72911 \
            --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID=22978141935

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jawan-flutter-release
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
