name: Ayez Flutter Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ayez-native-production-ready

permissions:
  contents: write

env:
  JAWAN_FIREBASE_PROJECT_ID: "jwan-delivery-c930d-72911"
  JAWAN_FIREBASE_MESSAGING_SENDER_ID: "22978141935"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Prepare Firebase and branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-app/assets/branding mobile-app/android/app/src/main/res/drawable
          cp assets/branding/logo-external.png mobile-app/assets/branding/jawan-logo.png
          cp mobile-app/assets/branding/jawan-logo.png mobile-app/android/app/src/main/res/drawable/jawan_logo.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('mobile-app/android/app/google-services.json')
          data=json.loads(p.read_text())
          client=data['client'][0]
          vals={
            'JAWAN_FIREBASE_API_KEY': client['api_key'][0]['current_key'],
            'JAWAN_FIREBASE_APP_ID': client['client_info']['mobilesdk_app_id'],
            'JAWAN_FIREBASE_PROJECT_ID': data['project_info']['project_id'],
            'JAWAN_FIREBASE_MESSAGING_SENDER_ID': data['project_info']['project_number'],
          }
          with open('/tmp/firebase_env','w') as f:
            for k,v in vals.items(): f.write(f'{k}={v}\n')
          PY
          cat /tmp/firebase_env >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile-app/android/ayez-release.jks
            cat > mobile-app/android/key.properties <<EOF
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyPassword=$ANDROID_KEY_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
storeFile=../ayez-release.jks
EOF
          else
            echo "No Android release signing secret supplied; branch builds use the Gradle debug fallback."
          fi

      - name: Verify native Flutter project
        working-directory: mobile-app
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main_native.dart
          test -f lib/native_entry.dart
          test -f lib/ayez_app_shell.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          test -f android/app/google-services.json
          grep -q 'applicationId = "sd.jawan.delivery"' android/app/build.gradle
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build APK
        working-directory: mobile-app
        run: flutter build apk --release --target lib/main_native.dart --dart-define=JAWAN_FIREBASE_API_KEY="$JAWAN_FIREBASE_API_KEY" --dart-define=JAWAN_FIREBASE_APP_ID="$JAWAN_FIREBASE_APP_ID" --dart-define=JAWAN_FIREBASE_PROJECT_ID="$JAWAN_FIREBASE_PROJECT_ID" --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID="$JAWAN_FIREBASE_MESSAGING_SENDER_ID"

      - name: Build AAB
        working-directory: mobile-app
        run: flutter build appbundle --release --target lib/main_native.dart --dart-define=JAWAN_FIREBASE_API_KEY="$JAWAN_FIREBASE_API_KEY" --dart-define=JAWAN_FIREBASE_APP_ID="$JAWAN_FIREBASE_APP_ID" --dart-define=JAWAN_FIREBASE_PROJECT_ID="$JAWAN_FIREBASE_PROJECT_ID" --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID="$JAWAN_FIREBASE_MESSAGING_SENDER_ID"

      - name: Verify artifacts
        working-directory: mobile-app
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayez-flutter-release-${{ github.run_number }}
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/flutter-apk/app-release.apk.sha256
            mobile-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ayez-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            mobile-app/build/app/outputs/flutter-apk/app-release.apk \
            mobile-app/build/app/outputs/flutter-apk/app-release.apk.sha256 \
            mobile-app/build/app/outputs/bundle/release/app-release.aab \
            --title "عايز Android $TAG" \
            --notes "Flutter Android release generated by GitHub Actions from commit ${GITHUB_SHA}."