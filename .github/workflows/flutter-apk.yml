name: Jawan Flutter Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - flutter-native-20260913

permissions:
  contents: read

env:
  JAWAN_FIREBASE_API_KEY: "AIzaSyDQKVdQ7laLfNyZyIdtHbS91wVtSd1QeuM"
  JAWAN_FIREBASE_APP_ID: "1:22978141935:web:cea2a66dd01f5bec04051a"
  JAWAN_FIREBASE_PROJECT_ID: "jwan-delivery-c930d-72911"
  JAWAN_FIREBASE_MESSAGING_SENDER_ID: "22978141935"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Jawan branding assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-app/assets/branding
          mkdir -p mobile-app/android/app/src/main/res/drawable
          curl -fsSL \
            https://raw.githubusercontent.com/jwan-delivery/jwan/main/assets/branding/logo-external.png \
            -o mobile-app/assets/branding/jawan-logo.png
          cp mobile-app/assets/branding/jawan-logo.png \
            mobile-app/android/app/src/main/res/drawable/jawan_logo.png
          test -s mobile-app/assets/branding/jawan-logo.png
          test -s mobile-app/android/app/src/main/res/drawable/jawan_logo.png

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Verify tracked native project
        working-directory: mobile-app
        run: |
          test -f pubspec.yaml
          test -f lib/main_native.dart
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          test -f assets/branding/jawan-logo.png
          test -f android/app/src/main/res/drawable/jawan_logo.png
          grep -q 'applicationId = "sd.jawan.delivery"' android/app/build.gradle
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          echo "Using tracked native Android project and lib/main_native.dart."

      - name: Verify Firebase build configuration
        shell: bash
        run: |
          test -n "$JAWAN_FIREBASE_API_KEY"
          test -n "$JAWAN_FIREBASE_APP_ID"
          test -n "$JAWAN_FIREBASE_PROJECT_ID"
          test -n "$JAWAN_FIREBASE_MESSAGING_SENDER_ID"
          echo "Firebase production dart-defines are configured."

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build Release APK
        working-directory: mobile-app
        run: |
          flutter build apk --release \
            --target lib/main_native.dart \
            --dart-define=JAWAN_FIREBASE_API_KEY="$JAWAN_FIREBASE_API_KEY" \
            --dart-define=JAWAN_FIREBASE_APP_ID="$JAWAN_FIREBASE_APP_ID" \
            --dart-define=JAWAN_FIREBASE_PROJECT_ID="$JAWAN_FIREBASE_PROJECT_ID" \
            --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID="$JAWAN_FIREBASE_MESSAGING_SENDER_ID"

      - name: Build Release AAB
        working-directory: mobile-app
        run: |
          flutter build appbundle --release \
            --target lib/main_native.dart \
            --dart-define=JAWAN_FIREBASE_API_KEY="$JAWAN_FIREBASE_API_KEY" \
            --dart-define=JAWAN_FIREBASE_APP_ID="$JAWAN_FIREBASE_APP_ID" \
            --dart-define=JAWAN_FIREBASE_PROJECT_ID="$JAWAN_FIREBASE_PROJECT_ID" \
            --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID="$JAWAN_FIREBASE_MESSAGING_SENDER_ID"

      - name: Verify artifacts
        working-directory: mobile-app
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jawan-flutter-release
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
