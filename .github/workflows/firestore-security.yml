name: Firestore Security Rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - 'firebase.json'
      - '.github/workflows/firestore-security.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - 'firebase.json'
      - '.github/workflows/firestore-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security-tests/package-lock.json

      - name: Install security test dependencies
        working-directory: security-tests
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Run Firestore rules tests
        working-directory: security-tests
        run: firebase emulators:exec --only firestore "node security-test.js"
