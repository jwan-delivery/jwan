name: Build Current Flutter Jawan APK

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-native-20260913

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flutter branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify Flutter project
        working-directory: mobile-app
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android
          echo "Flutter project OK"

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build Debug APK
        working-directory: mobile-app
        run: flutter build apk --debug

      - name: Build Release APK
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jawan-flutter-current-debug
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jawan-flutter-current-release
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
