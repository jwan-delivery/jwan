name: Build Current Flutter Ayez APK

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-native-20260913

permissions:
  contents: read

env:
  JAWAN_FIREBASE_PROJECT_ID: "jwan-delivery-c930d-72911"
  JAWAN_FIREBASE_MESSAGING_SENDER_ID: "22978141935"

jobs:
  build:
    name: Build Flutter Ayez App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flutter branch
        uses: actions/checkout@v4

      - name: Prepare Ayez branding and Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-app/assets/branding
          mkdir -p mobile-app/android/app/src/main/res/drawable
          if [ -f mobile-app/assets/branding/new_logo_3ayez.png ]; then
            cp mobile-app/assets/branding/new_logo_3ayez.png mobile-app/assets/branding/jawan-logo.png
          else
            curl -fsSL https://raw.githubusercontent.com/jwan-delivery/jwan/main/assets/branding/logo-external.png -o mobile-app/assets/branding/jawan-logo.png
          fi
          cp mobile-app/assets/branding/jawan-logo.png mobile-app/android/app/src/main/res/drawable/jawan_logo.png

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('mobile-app/android/app/google-services.json').read_text(encoding='utf-8'))
          client = data['client'][0]
          env = {
              'JAWAN_FIREBASE_API_KEY': client['api_key'][0]['current_key'],
              'JAWAN_FIREBASE_APP_ID': client['client_info']['mobilesdk_app_id'],
              'JAWAN_FIREBASE_PROJECT_ID': data['project_info']['project_id'],
              'JAWAN_FIREBASE_MESSAGING_SENDER_ID': data['project_info']['project_number'],
          }
          with open('/tmp/firebase_env', 'w', encoding='utf-8') as f:
              for key, value in env.items(): f.write(f'{key}={value}\n')
          PY
          cat /tmp/firebase_env >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile-app/lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace('جوان للتوصيل', 'عايز')
          s = s.replace('جوان •', 'عايز •')
          s = s.replace('أحتاج مساعدة من جوان للتوصيل', 'أحتاج مساعدة من عايز')
          s = s.replace("Icon(Icons.local_shipping)", "ImageIcon(AssetImage('assets/branding/jawan-logo.png'), size: 24)")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Flutter version
        run: flutter --version

      - name: Verify Flutter project
        working-directory: mobile-app
        run: |
          test -f pubspec.yaml
          test -f lib/main_native.dart
          test -f lib/native_entry.dart
          test -f lib/ayez_app_shell.dart
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          test -f android/app/google-services.json
          test -f assets/branding/jawan-logo.png
          test -f android/app/src/main/res/drawable/jawan_logo.png
          grep -q 'applicationId = "sd.jawan.delivery"' android/app/build.gradle
          grep -q 'com.google.gms.google-services' android/app/build.gradle
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/java/sd/jawan/delivery/MainActivity.java
          echo "Tracked native Flutter project OK"

      - name: Verify Firebase build configuration
        shell: bash
        run: |
          test -n "$JAWAN_FIREBASE_API_KEY"
          test -n "$JAWAN_FIREBASE_APP_ID"
          test -n "$JAWAN_FIREBASE_PROJECT_ID"
          test -n "$JAWAN_FIREBASE_MESSAGING_SENDER_ID"
          echo "Firebase Android configuration loaded from google-services.json."

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build Debug APK
        working-directory: mobile-app
        run: |
          flutter build apk --debug \
            --target lib/main_native.dart \
            --dart-define=JAWAN_FIREBASE_API_KEY="$JAWAN_FIREBASE_API_KEY" \
            --dart-define=JAWAN_FIREBASE_APP_ID="$JAWAN_FIREBASE_APP_ID" \
            --dart-define=JAWAN_FIREBASE_PROJECT_ID="$JAWAN_FIREBASE_PROJECT_ID" \
            --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID="$JAWAN_FIREBASE_MESSAGING_SENDER_ID"

      - name: Build Release APK
        working-directory: mobile-app
        run: |
          flutter build apk --release \
            --target lib/main_native.dart \
            --dart-define=JAWAN_FIREBASE_API_KEY="$JAWAN_FIREBASE_API_KEY" \
            --dart-define=JAWAN_FIREBASE_APP_ID="$JAWAN_FIREBASE_APP_ID" \
            --dart-define=JAWAN_FIREBASE_PROJECT_ID="$JAWAN_FIREBASE_PROJECT_ID" \
            --dart-define=JAWAN_FIREBASE_MESSAGING_SENDER_ID="$JAWAN_FIREBASE_MESSAGING_SENDER_ID"

      - name: Verify APK package and artifact
        working-directory: mobile-app
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-debug.apk
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ayez-flutter-current-debug
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ayez-flutter-current-release
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
