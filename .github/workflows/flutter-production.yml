name: Ayez Flutter Production CI

on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/flutter-production.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'mobile-app/**'
      - '.github/workflows/flutter-production.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: stable

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test --coverage

  android-build:
    name: Android release build
    needs: analyze-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Verify Android Firebase configuration
        run: |
          if [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "FIREBASE_ANDROID_APP_ID is not configured; release artifacts will not be built in this run."
            exit 0
          fi
      - name: Build release APK
        if: ${{ env.FIREBASE_ANDROID_APP_ID != '' }}
        run: flutter build apk --release --dart-define=FIREBASE_ANDROID_APP_ID=${{ env.FIREBASE_ANDROID_APP_ID }}
      - name: Build release AAB
        if: ${{ env.FIREBASE_ANDROID_APP_ID != '' }}
        run: flutter build appbundle --release --dart-define=FIREBASE_ANDROID_APP_ID=${{ env.FIREBASE_ANDROID_APP_ID }}
      - name: Upload release artifacts
        if: ${{ env.FIREBASE_ANDROID_APP_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ayez-android-release
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
