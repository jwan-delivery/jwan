name: Flutter Production CI

on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/flutter-production.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/flutter-production.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: stable

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  android-build:
    name: Android release build
    needs: analyze-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build unsigned release APK
        run: flutter build apk --release --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}
      - name: Build unsigned release AAB
        run: flutter build appbundle --release --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: jawan-android-release
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
