name: Android build and security preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile-app/**"
      - "firestore.rules"
      - "firebase.json"
      - "security-tests/**"
      - ".github/workflows/android-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks-and-apk:
    name: Flutter analyze, tests, and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug --target lib/main_native.dart --dart-define=JAWAN_APPCHECK_DEBUG=true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jawan-android-debug-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  firestore-rules-tests:
    name: Firestore security rules emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: security-tests/package-lock.json

      - name: Install security test dependencies
        working-directory: security-tests
        run: npm ci

      - name: Run Firestore rules tests in emulator
        run: npx --yes firebase-tools --config ../firebase.json emulators:exec --only firestore --project demo-jwan-delivery-c930d "npm test"
        working-directory: security-tests
