// Flutter Gradle is provided by the Flutter SDK through settings.gradle.
// Repositories are centralized in settings.gradle so Flutter's Maven
// repository remains visible to the application and plugins.

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
